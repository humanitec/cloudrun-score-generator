version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns:
          - "*"
    commit-message:
      prefix: "build"
      include: "scope"
